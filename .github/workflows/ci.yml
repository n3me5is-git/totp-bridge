name: Test and build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check committed standalone build
        run: git diff --exit-code -- dist/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: TOTP-Bridge-standalone
          path: dist/index.html
