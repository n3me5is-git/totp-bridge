name: Release standalone HTML
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify committed standalone build
        run: git diff --exit-code -- dist/TOTP-Bridge.html
      - name: Publish release with standalone HTML
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/TOTP-Bridge.html --verify-tag --title "TOTP Bridge $RELEASE_TAG" --notes-file RELEASE-NOTES.md
